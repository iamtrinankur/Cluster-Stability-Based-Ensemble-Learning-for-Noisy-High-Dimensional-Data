[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nacc-clustering"
version = "1.0.0"
description = "Noise-Aware Consensus Clustering (NACC): Cluster Stability-Based Ensemble Learning for Noisy High-Dimensional Data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NACC Research Team", email = "research@nacc-clustering.org" }
]
keywords = [
    "clustering",
    "consensus-clustering",
    "cluster-stability",
    "high-dimensional-data",
    "feature-selection",
    "ensemble-learning",
    "noise-robustness",
    "bioinformatics",
    "genetic-algorithm",
    "particle-swarm-optimization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.1.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]


[project.scripts]
nacc = "src.nacc.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
